# Settings reference: https://sw.kovidgoyal.net/kitty/conf/
font_size 16.0

# Steady underline cursor; briefly trail it on large movements.
cursor_shape underline
cursor_blink_interval 0
cursor_trail 1
disable_ligatures cursor

enable_audio_bell no
inactive_text_alpha 0.1

# Make Option behave as Alt for shell shortcuts.
macos_option_as_alt yes
macos_traditional_fullscreen yes

# Read formatted scrollback in less, starting at the bottom.
map f2 launch --stdin-source=@screen_scrollback --stdin-add-formatting less +G -R

# Notify when a command taking 10s+ finishes in an unfocused window.
# Uses kitty shell integration; fish/config.fish disables done's duplicate alerts.
notify_on_cmd_finish unfocused 10.0

# Keep these markers so kitten choose-fonts can update the font block.
# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Arrow used by the prompt; supplied by the font-fira-code-nerd-font cask.
symbol_map U+279C "FiraCode Nerd Font Mono"

# Toggle a full-size view of the current split (Ctrl+Shift+X).
map kitty_mod+x toggle_layout stack
# Show URL hints (Ctrl+Shift+E).
map kitty_mod+e kitten hints
