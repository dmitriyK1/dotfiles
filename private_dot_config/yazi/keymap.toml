[[mgr.prepend_keymap]]
on = [ "g", "r" ]
desc = "Go to a git repository root"
run = '''
	shell 'ya pub dds-cd --str "$(git rev-parse --show-toplevel)"' --confirm
'''

[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell "$SHELL" --block --confirm'
desc = "Open shell here"

[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"

[[mgr.prepend_keymap]]
on = "<C-p>"
run = '''
  shell 'qlmanage -p "$@"' --confirm
'''

# Navigation in the manager
[[mgr.prepend_keymap]]
on = "k"
run = "arrow -1"
desc = "Previous file"

[[mgr.prepend_keymap]]
on = "j"
run = "arrow 1"
desc = "Next file"
