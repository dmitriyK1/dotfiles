# Включить Architect Mode
architect: true

# Основная модель и редактор
model: deepseek/deepseek-v4-pro
editor-model: deepseek/deepseek-flash
editor-edit-format: editor-diff
weak-model: deepseek/deepseek-flash

# Кэширование контекста (DeepSeek кэширует сам; пригодится для других провайдеров)
cache-prompts: true

# Создавать коммит после каждого шага Aider
auto-commits: true

# Перед правкой файла сначала коммитить ваши незакоммиченные изменения отдельным коммитом
# (иначе они попадут в коммит Aider и /undo откатит их вместе с ним)
dirty-commits: true

# Запускать pre-commit хуки репозитория для коммитов Aider
git-commit-verify: true

# История чата и ввода пишется в корень репозитория (.aider* в ~/.gitignore_global).
# Не подгружать её при старте; продолжить прошлую сессию: aider --restore-chat-history

# Общие инструкции агента (из chezmoi) и инструкции репозитория (CLAUDE.md / AGENTS.md), если есть
# (относительный путь считается от папки запуска aider; симлинк на тот же файл читается один раз)
read:
  - ~/.aider/CONVENTIONS.md
  - CLAUDE.md
  - AGENTS.md

map-tokens: 2048
analytics-disable: true
notifications: true

yes-always: true

# Линтер и тесты задаются в .aider.conf.yml конкретного репозитория, например:
# lint-cmd: "typescript: pnpm exec eslint"
# auto-test: true
# test-cmd: pnpm test
